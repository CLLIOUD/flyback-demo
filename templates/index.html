<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Time Capsule Flyback</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body class="home-page">
    <header class="site-header">
        <div class="site-header-inner">
            <img class="brand-logo" src="/static/images/kac-logo.png" alt="한국공항공사 KAC">
            <p class="service-name">TIME CAPSULE FLYBACK</p>
        </div>
    </header>

    <main class="event-hero">
        <div class="event-hero-inner">
            <section class="intro" aria-labelledby="event-title">
                <p class="eyebrow eyebrow-light">TIME CAPSULE FLYBACK</p>
                <h1 id="event-title">
                    <span class="title-line">여행의 순간을</span>
                    <span class="title-line">1년 뒤 다시 만나보세요</span>
                </h1>
                <p class="description">
                    지금 남긴 여행의 기억이<br class="desktop-break">
                    다음 여행을 다시 시작하게 합니다.
                </p>
                <p class="hero-service-note">공항에서 시작하는 디지털 타임캡슐 여행 서비스</p>
            </section>

            <section class="qr-panel" aria-label="QR 코드 안내">
                <p class="step-label">STEP 01</p>
                <h2>QR을 스캔하고<br>나만의 여행 엽서를 만들어보세요.</h2>
                <div class="qr-frame">
                    <img class="qr-image" id="postcard-qr" src="" alt="디지털 엽서 제작 화면으로 이동하는 QR 코드">
                </div>
                <p class="qr-guide">스마트폰 카메라로 스캔해주세요.</p>
            </section>
        </div>
    </main>

    <footer class="home-footer">
        <p>여행의 오늘과 내일을 연결하는 공항 디지털 경험</p>
    </footer>

    <script src="{{ url_for('static', path='/js/app.js') }}"></script>
</body>
</html>
